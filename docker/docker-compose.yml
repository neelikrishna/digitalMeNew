services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: digitalself-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-digitalself}
      POSTGRES_USER: ${DB_USER:-digitalself_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - digitalself_postgres_data:/var/lib/postgresql/data
    networks:
      - digitalself

  ollama:
    image: ollama/ollama:latest
    container_name: digitalself-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - digitalself_ollama_data:/root/.ollama
    networks:
      - digitalself

volumes:
  digitalself_postgres_data:
  digitalself_ollama_data:

networks:
  digitalself:
    driver: bridge
